# --- SonarQube Cloud project identity ---
# IMPORTANT: organization + projectKey must EXACTLY match what SonarCloud
# assigns when you import/create this project. Adjust both if they differ.
sonar.organization=broadvision
sonar.projectKey=broadvision_sonar-sample-frontend
sonar.projectName=sonar-sample-frontend

# --- Analysis scope ---
sonar.sources=.
sonar.exclusions=**/node_modules/**, **/.next/**, **/dist/**, **/build/**

# NOTE: No hardcoded sonar.branch.name here — the CI action auto-detects the
# branch/PR. (Hardcoding it caused issues on the monorepo.)
